.trigger-downstream-pipeline-ref:
  stage: postrelease
  variables:
    UPSTREAM_CI_COMMIT_REF: $CI_COMMIT_BRANCH
    UPSTREAM_CI_COMMIT_SHORT_SHA: $CI_COMMIT_SHORT_SHA
    UPSTREAM_RUNNER_IMAGE_REPO: $CI_REGISTRY_IMAGE
    UPSTREAM_RUNNER_HELPER_IMAGE_REPO: $CI_REGISTRY_IMAGE/gitlab-runner-helper
  rules:
    # copy of .rules:merge_request_pipelines:no_docs:only_canonical, slightly modified for variables
    - if: '$CI_PROJECT_NAMESPACE !~ /^gitlab-org($|\/)/'
      when: never
    - if: $CI_PROJECT_PATH != "gitlab-org/gitlab-runner"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"
      changes: !reference [.code-backstage-patterns]
      variables:
        UPSTREAM_CI_COMMIT_REF: "refs/merge-requests/${CI_MERGE_REQUEST_IID}/train"
        UPSTREAM_RUNNER_IMAGE_REPO: $CI_REGISTRY_IMAGE/gitlab-runner-dev
        UPSTREAM_RUNNER_HELPER_IMAGE_REPO: $CI_REGISTRY_IMAGE/gitlab-runner-helper-dev
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "detached"
      changes: !reference [.code-backstage-patterns]
      variables:
        UPSTREAM_CI_COMMIT_REF: "refs/merge-requests/${CI_MERGE_REQUEST_IID}/head"
        UPSTREAM_RUNNER_IMAGE_REPO: $CI_REGISTRY_IMAGE/gitlab-runner-dev
        UPSTREAM_RUNNER_HELPER_IMAGE_REPO: $CI_REGISTRY_IMAGE/gitlab-runner-helper-dev
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merged_result"
      changes: !reference [.code-backstage-patterns]
      variables:
        UPSTREAM_CI_COMMIT_REF: "refs/merge-requests/${CI_MERGE_REQUEST_IID}/merge"
        UPSTREAM_RUNNER_IMAGE_REPO: $CI_REGISTRY_IMAGE/gitlab-runner-dev
        UPSTREAM_RUNNER_HELPER_IMAGE_REPO: $CI_REGISTRY_IMAGE/gitlab-runner-helper-dev
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: !reference [.code-backstage-patterns]
      variables:
        UPSTREAM_CI_COMMIT_REF: $CI_COMMIT_REF_NAME
    - if: $CI_COMMIT_REF_NAME =~ /\Av[0-9]+\.[0-9]+\.[0-9]+?\z/
      changes: !reference [.code-backstage-patterns]
      variables:
        UPSTREAM_CI_COMMIT_REF: $CI_COMMIT_REF_NAME
    - if: $CI_COMMIT_REF_NAME =~ /\Av[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?\z/
      changes: !reference [.code-backstage-patterns]
      variables:
        UPSTREAM_CI_COMMIT_REF: $CI_COMMIT_REF_NAME

trigger UBI images build:
  extends:
    - .trigger-downstream-pipeline-ref
  needs:
    - job: "development S3"
      optional: true
    - job: "bleeding edge S3"
      optional: true
    - job: "stable S3"
      optional: true
  variables:
    BUILD_RELEASE: $CI_COMMIT_REF_NAME
    BUILD_RELEASE_SHA: $CI_COMMIT_SHORT_SHA
  trigger:
    strategy: depend
    project: gitlab-org/ci-cd/gitlab-runner-ubi-images

trigger runner-incept tests:
  extends:
    - .trigger-downstream-pipeline-ref
    # make sure the needs jobs here match the ones in the downstream pipeline, or jobs in the downstream pipeline will
    # fail with: "This job could not start because it could not retrieve the needed artifacts."
  needs:
    - binaries
    - "helper images"
    - "prebuilt helper images"
    - job: "development docker images"
      optional: true
    - job: "bleeding edge docker images"
      optional: true
    - job: "stable docker images"
      optional: true
  trigger:
    project: gitlab-org/ci-cd/tests/runner-incept
    # strategy: depend

package test variables:
  extends:
    - .trigger-downstream-pipeline-ref
    - .rules:release:bleeding-edge
    - .kubernetes runner
  needs:
    - "unstable pulp"
  image: alpine:latest
  artifacts:
    paths:
      - package_test_vars.env
  before_script:
    - apk add git bash
  script:
    - rm -f package_test_vars.env
    - echo "export RUNNER_FROM_VERSION=\"$(git tag | sort -rV | sed "1q;d" | cut -c2-)\"" >> package_test_vars.env
    - echo "export RUNNER_FROM_BRANCH=\"gitlab-runner\"" >> package_test_vars.env
    - echo "export RUNNER_TO_VERSION=\"$(ci/version)\"" >> package_test_vars.env
    - echo "export RUNNER_TO_BRANCH=\"unstable\"" >> package_test_vars.env

trigger runner package tests:
  extends:
    - .trigger-downstream-pipeline-ref
    - .rules:release:bleeding-edge
  needs:
    - "package test variables"
  trigger:
    # strategy: depend
    project: gitlab-org/ci-cd/runner-tools/gitlab-runner-package-tests

.verify-resources:
  extends:
    - .rules:merge_request_pipelines:no_docs
    - .docker
  stage: postrelease
  script:
    - mage resources:verifyAll

verify development resources:
  extends:
    - .verify-resources
    - .rules:release:development:merge-requests
  needs:
    - job: "development docker images"
      artifacts: true

verify bleeding edge resources:
  extends:
    - .verify-resources
    - .rules:release:bleeding-edge
  environment:
    name: bleeding_edge/docker_images/linux
    url: https://hub.docker.com/r/gitlab/gitlab-runner/tags/
  needs:
    - job: "bleeding edge docker images"
      artifacts: true

verify stable resources:
  extends:
    - .verify-resources
    - .rules:release:stable:branch
  environment:
    name: stable/docker_images/linux
    url: https://hub.docker.com/r/gitlab/gitlab-runner/tags/
  needs:
    - job: "stable docker images"
      artifacts: true

stable gitlab release:
  stage: postrelease
  extends:
    - .rules:release:stable-or-rc
    - .kubernetes runner
  dependencies: []
  image: python:3.13-alpine
  variables:
    CHANGELOG: https://gitlab.com/gitlab-org/gitlab-runner/blob/$CI_COMMIT_TAG/CHANGELOG.md
    S3: https://gitlab-runner-downloads.s3.amazonaws.com/$CI_COMMIT_TAG
    # The security fork also publishes releases to the canonical project.
    RELEASE_PROJECT_ID: "250833"
  environment:
    name: stable/gitlab
    url: https://gitlab.com/gitlab-org/gitlab-runner/-/releases
  before_script: []
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - runner_interrupted
  script:
    - |
      release_description="See [the changelog]($CHANGELOG) :rocket:

      GitLab Runner documentation can be found at https://docs.gitlab.com/runner/."
      python3 ci/publish-runner-release.py \
        --api-url "$CI_API_V4_URL" \
        --project-id "$RELEASE_PROJECT_ID" \
        --tag "$CI_COMMIT_TAG" \
        --description "$release_description" \
        --s3-base-url "$S3"

# One Slack message per pipeline when any pulp job fails. Covers main, vX.Y.Z-rcN tags and
# N-N-stable on the canonical project, and vX.Y.Z tags on both projects. Excludes feature/* and
# security fork N-N-stable. Needs PULP_ALERT_SLACK_WEBHOOK_URL.
notify pulp failure:
  stage: postrelease
  extends:
    - .kubernetes runner
    - .no_cache_and_dependencies
  image: alpine:latest
  interruptible: false
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "1"
  needs:
    - job: unstable pulp
      optional: true
      artifacts: false
    - job: stable pulp
      optional: true
      artifacts: false
  rules:
    - if: !reference [.if-runner-default-branch, if]
      changes: !reference [.code-backstage-patterns]
      when: on_failure
    - if: !reference [.if-runner-stable-release-ref, if]
      changes: !reference [.code-backstage-patterns]
      when: on_failure
    - if: !reference [.if-runner-bleeding-edge-release-ref, if]
      changes: !reference [.code-backstage-patterns]
      when: on_failure
    - if: !reference [.if-runner-stable-ref, if]
      changes: !reference [.code-backstage-patterns]
      when: on_failure
    - if: !reference [.if-security-runner-release-ref, if]
      changes: !reference [.code-backstage-patterns]
      when: on_failure
  before_script:
    - apk add --no-cache curl jq
  script:
    - scripts/notify-pulp-failure
